name: Build and publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash   # explicit bash runs with -eo pipefail, so `| tee` can't hide failures

env:
  # Bump when rebuilding the same Sury sources (changes the +pfbN suffix)
  REVISION: '1'
  SOURCE_URL: https://packages.sury.org/php/pool/main/p

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2']
        target: [ubuntu20.04]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download pinned Sury source
        run: |
          mkdir sources-dl out
          while read -r _ file; do
            curl -fsSL --retry 3 "$SOURCE_URL/php${{ matrix.php }}/${file//+/%2B}" -o "sources-dl/$file"
          done < "sources/php${{ matrix.php }}.sha256"
          (cd sources-dl && sha256sum -c "../sources/php${{ matrix.php }}.sha256")

      - name: Build in ${{ matrix.target }}
        run: |
          target=${{ matrix.target }}
          image="ubuntu:${target#ubuntu}"
          docker run --rm --platform linux/amd64 \
            -v "$PWD:/repo:ro" -v "$PWD/sources-dl:/sources:ro" -v "$PWD/out:/out" \
            -e PHP=${{ matrix.php }} -e REVISION -e JOBS=4 \
            "$image" bash /repo/build.sh 2>&1 | tee "out/build-php${{ matrix.php }}.log"
          test -s "out/SHA256SUMS-php${{ matrix.php }}"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: php${{ matrix.php }}-${{ matrix.target }}-amd64
          path: out/
          retention-days: 14

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: php*-ubuntu20.04-amd64

      - name: Import signing key
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          echo "$APT_SIGNING_KEY" | gpg --batch --import
          echo "SIGNING_KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')" >> "$GITHUB_ENV"

      - name: Build APT repository
        run: |
          sudo apt-get install -y --no-install-recommends apt-utils
          scripts/make-apt-repo.sh artifacts site focal
          cp README.md site/
          # Landing page so the repo URL isn't a bare 404 in a browser
          cat > site/index.html <<'EOF'
          <!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <title>php-focal-backports</title>
          <style>body{font:16px/1.5 system-ui,sans-serif;max-width:46rem;margin:2rem auto;padding:0 1rem}pre{background:#8881;padding:.75rem;overflow-x:auto}</style>
          <h1>php-focal-backports</h1>
          <p>Signed APT repository: patched PHP 7.4, 8.0, 8.1 and 8.2 for Ubuntu 20.04 (focal), amd64.</p>
          <p>Setup, verification and details: <a href="https://github.com/wmfairuz/php-focal-backports#readme">github.com/wmfairuz/php-focal-backports</a></p>
          <p>Set up a server with one command:</p>
          <pre>curl -fsSL https://raw.githubusercontent.com/wmfairuz/php-focal-backports/main/install.sh | sudo bash</pre>
          <p>Or add it by hand:</p>
          <pre>deb [signed-by=/usr/share/keyrings/php-focal-backports.gpg] https://wmfairuz.github.io/php-focal-backports focal main</pre>
          <p>Signing key: <a href="key.gpg">key.gpg</a> · <a href="key.asc">key.asc</a> — fingerprint EAD9 0151 D4B3 AF78 A6E7 FB1B 408D 844A ED9B 9D0A</p>
          EOF
          ls -la site site/dists/focal

      - name: Attach packages to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --verify-tag --title "PHP backports for Ubuntu 20.04 ($TAG)" --notes-file README.md
          gh release upload "$TAG" artifacts/*/SHA256SUMS-* artifacts/*/build-php*.log site/key.asc

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
